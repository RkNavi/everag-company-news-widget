name: Update company news

on:
  workflow_dispatch:
  schedule:
    # Once per day, away from the top of the hour. FetchRSS's free plan refreshes daily.
    - cron: "17 11 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch RSS feed
        run: python scripts/fetch_feed.py

      - name: Record successful check
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > last_checked.txt

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json last_checked.txt
          git diff --cached --quiet && exit 0
          git commit -m "Update company news feed"
          git push
